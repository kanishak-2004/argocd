apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: python:3.9-slim
        command: ["python", "-c"]
        args:
          - |
            from flask import Flask
            app = Flask(__name__)
            @app.route('/')
            def hello():
                return "Hello from GitOps via Argo CD!"
            app.run(host='0.0.0.0', port=8080)
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: python-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: python-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
